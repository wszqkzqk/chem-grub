name: Bug report
description: Report a rendering, localization, build, or installation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, GRUB version, BIOS/UEFI, resolution, and GRUB language.
      placeholder: Arch Linux, GRUB 2.12, UEFI, 1920x1080, zh_CN
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Commands or menu actions that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or error text
      description: Add a screenshot or exact error message. Do not include credentials or private keys.
