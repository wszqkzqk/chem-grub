name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin make unzip

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Build and validate
        run: make check

      - name: Check installer syntax
        run: sh -n scripts/install.sh

      - name: Check archive integrity
        run: unzip -t dist/chem-grub.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-${{ github.sha }}
          path: |
            dist/chem-grub.zip
            preview.png
            preview-nested.png
            preview-arch.png
            preview-de.png
          if-no-files-found: error

  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm git sudo

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build and check the package
        run: su builder -c "cd '${GITHUB_WORKSPACE}/archlinux' && makepkg --syncdeps --noconfirm --cleanbuild"

      - name: Upload the Arch package
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-archlinux-${{ github.sha }}
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish commit release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute the commit version
        id: version
        run: echo "version=r$(git rev-list --count HEAD).$(git log -1 --format=%cd --date=format:%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Create the commit release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Chemistry GRUB ${{ steps.version.outputs.version }}
          files: |
            release-files/dist/chem-grub.zip
            release-files/*.pkg.tar.zst
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true

  aur-publish:
    name: Publish to AUR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, arch-package, publish]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_PACKAGE: chem-grub
    steps:
      - id: credentials
        name: Check AUR credentials
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          if [ -n "$AUR_SSH_PRIVATE_KEY" ] && [ -n "$AUR_USERNAME" ] && [ -n "$AUR_EMAIL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR credentials are not configured; skipping AUR publication."
          fi

      - name: Check out source
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install AUR tools
        if: steps.credentials.outputs.configured == 'true'
        run: pacman -Syu --noconfirm git openssh

      - name: Create a build user
        if: steps.credentials.outputs.configured == 'true'
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Configure AUR SSH
        if: steps.credentials.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          cat > /root/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile /root/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 /root/.ssh/config

      - name: Build the AUR package and generate .SRCINFO
        if: steps.credentials.outputs.configured == 'true'
        run: |
          mkdir -p /tmp/aur-build
          cp archlinux/PKGBUILD-AUR /tmp/aur-build/PKGBUILD
          chown -R builder:builder /tmp/aur-build
          su builder -c 'cd /tmp/aur-build && makepkg --syncdeps --noconfirm --clean'
          su builder -c 'cd /tmp/aur-build && makepkg --printsrcinfo' > /tmp/aur-build/.SRCINFO

      - name: Push to AUR
        if: steps.credentials.outputs.configured == 'true'
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -eu
          git config --global user.name "${AUR_USERNAME}"
          git config --global user.email "${AUR_EMAIL}"
          if ! git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" /tmp/aur-repo; then
            mkdir -p /tmp/aur-repo
            cd /tmp/aur-repo
            git init
            git remote add origin "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git"
          fi
          cd /tmp/aur-repo
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            git pull --rebase origin master
          fi
          cp /tmp/aur-build/PKGBUILD .
          cp /tmp/aur-build/.SRCINFO .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR changes"
          else
            git commit -m "Update to ${GITHUB_SHA}"
            git push origin master
          fi
