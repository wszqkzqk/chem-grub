name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin make unzip

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Build and validate
        run: make check

      - name: Check installer syntax
        run: sh -n scripts/install.sh

      - name: Check archive integrity
        run: unzip -t dist/chem-grub.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-${{ github.sha }}
          path: |
            dist/chem-grub.zip
            preview.png
            preview-nested.png
            preview-arch.png
            preview-de.png
          if-no-files-found: error

  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm git sudo

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build and check the package
        run: su builder -c "cd '${GITHUB_WORKSPACE}/archlinux' && makepkg --syncdeps --noconfirm --cleanbuild"

      - name: Upload the Arch package
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-archlinux-${{ github.sha }}
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish rolling release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Publish latest development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest \
              --title "Latest development build" \
              --notes "Rolling build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            --method PATCH \
            -F sha="${GITHUB_SHA}" \
            -F force=true
          mapfile -d '' -t files < <(find release-files -type f \( -name 'chem-grub.zip' -o -name '*.pkg.tar.zst' \) -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No distributable files found"
            exit 1
          fi
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id')
          for asset_id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate --jq '.[] | select(.name | endswith(".pkg.tar.zst")) | .id'); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" --method DELETE
          done
          gh release upload latest --clobber "${files[@]}"
          gh release edit latest \
            --title "Latest development build" \
            --notes "Rolling build from commit ${GITHUB_SHA}. This prerelease is updated automatically on every push to main; it is not a semantic-version release."
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --method PATCH \
            -F target_commitish="${GITHUB_SHA}"
