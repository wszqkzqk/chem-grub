name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin make unzip

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Build and validate
        run: make check

      - name: Check installer syntax
        run: sh -n scripts/install.sh

      - name: Check archive integrity
        run: unzip -t dist/chem-grub.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-${{ github.sha }}
          path: |
            dist/chem-grub.zip
            preview.png
            preview-nested.png
            preview-arch.png
            preview-de.png
          if-no-files-found: error

  arch-package:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install base tools
        run: pacman -Syu --noconfirm git sudo

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create a build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Build and check the package
        run: su builder -c "cd '${GITHUB_WORKSPACE}/archlinux' && makepkg --syncdeps --noconfirm --cleanbuild"

      - name: Upload the Arch package
        uses: actions/upload-artifact@v7
        with:
          name: chem-grub-archlinux-${{ github.sha }}
          path: archlinux/*.pkg.tar.zst
          if-no-files-found: error
