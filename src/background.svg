<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Chemistry GRUB laboratory</title>
  <desc id="desc">A midnight-teal chemistry laboratory with molecular sketches and Chem Grub, a studious grub scientist.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2428"/>
      <stop offset="0.52" stop-color="#081b20"/>
      <stop offset="1" stop-color="#051418"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#285b50" stop-opacity="0.58"/>
      <stop offset="0.64" stop-color="#163c37" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b2427" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff7e8"/>
      <stop offset="1" stop-color="#c8edbd"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9ad9bd" stroke-width="1" opacity="0.045"/>
      <circle cx="0" cy="0" r="1.5" fill="#a5e6c7" opacity="0.09"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#b7e8ce" opacity="0.12"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M-80 884 C260 732 438 1032 779 896 C1062 785 1244 852 1378 1038 L1378 1120H-80Z" fill="#0d2b2c" opacity="0.35"/>
